<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Repair Booking - Repair Service Booking</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="login-container">

        <div class="brand">REPAIR SERVICE BOOKING</div>

        <h1>Create Repair Booking</h1>

        <p class="subtitle">
            Enter the details of your repair request
        </p>

        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}

        <form method="POST">

            <label for="service">Repair Service</label>
            <select id="service" name="service" required>
                <option value="">Select a repair service</option>
                <option value="Electrical Repair">Phone Repair</option>
                <option value="Water leak Repair">Laptop Repair</option>
                <option value="Furniture Repair">Tablet Repair</option>
                <option value="Other">Other</option>
            </select>

            <label for="description">Repair Description</label>
            <textarea
                id="description"
                name="description"
                placeholder="Describe the problem with your device"
                rows="5"
                required
            ></textarea>

            <label for="preferred_date">Preferred Date</label>
            <input
                type="date"
                id="preferred_date"
                name="preferred_date"
                required
            >

            <label for="preferred_time">Preferred Time</label>
            <select id="preferred_time" name="preferred_time" required>
                <option value="">Select a preferred time</option>
                <option value="9:00 AM">9:00 AM</option>
                <option value="10:00 AM">10:00 AM</option>
                <option value="11:00 AM">11:00 AM</option>
                <option value="12:00 PM">12:00 PM</option>
                <option value="1:00 PM">1:00 PM</option>
                <option value="2:00 PM">2:00 PM</option>
                <option value="3:00 PM">3:00 PM</option>
                <option value="4:00 PM">4:00 PM</option>
            </select>

            <button type="submit">SUBMIT BOOKING</button>

        </form>

        <a href="{{ url_for('customer_home') }}" class="back-link">
            Back to Customer Home
        </a>

    </div>

</body>
</html>
